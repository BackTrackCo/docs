StylesPath = styles
MinAlertLevel = warning
Vocab = x402r

Packages = Microsoft, write-good, proselint

# Parse .mdx as Markdown so Vale doesn't need the separate mdx2vast binary
# (used by the PostToolUse hook for local edit-time linting). The CI action
# (errata-ai/vale-action) installs its own MDX parser server-side.
[formats]
mdx = md

[*.mdx]
BasedOnStyles = Vale, Microsoft, write-good, proselint, x402r

# Disable overly noisy Microsoft rules for docs
Microsoft.Contractions = NO
Microsoft.SentenceLength = suggestion
Microsoft.Passive = suggestion

# Vale.Terms reads the same accept.txt as Vale.Spelling but treats each entry
# as the canonical case form. That fires false positives whenever a vocab
# entry collides with a code identifier (e.g. PaymentInfo type vs paymentInfo
# variable, Hono package vs hono import path, Base chain vs base code
# identifier) or when the entry uses Vale's regex syntax (SDKs? becomes a
# literal canonical-form suggestion). Vocab here is for spelling acceptance
# only, not terminology enforcement — disabled.
Vale.Terms = NO

# Vale.Spelling stays at its default (error) severity here. CI gates real
# typos before merge — the right place for strict spell-check.
#
# The PostToolUse hook in workspace .claude/settings.json filters Vale.Spelling
# out of its output via `vale --filter='.Name != "Vale.Spelling"'` so Claude's
# self-correction context isn't drowned by chain-name and identifier false
# positives. CI (errata-ai/vale-action) does not apply that filter, so PR
# review still sees the full spell-check.
#
# Strict-in-CI / lenient-in-hook pattern, per GitLab and Vaadin Vale configs.
