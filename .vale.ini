StylesPath = styles
MinAlertLevel = warning
Vocab = x402r

Packages = Microsoft, write-good, proselint

# Parse .mdx as Markdown so Vale doesn't need the separate mdx2vast binary
# (used by the PostToolUse hook for local edit-time linting). The CI action
# (errata-ai/vale-action) installs its own MDX parser server-side.
#
# Tradeoff per Vale's MDX docs (https://vale.sh/docs/formats/mdx): mdx = md is
# an extension-level substitution, not real MDX support. JSX components
# (<CodeGroup>, <Note>, <Steps>), JSX expressions, and ESM imports/exports
# aren't parsed out and can leak into prose linting. Hook view (md mode) is
# strictly less accurate than CI view (mdx2vast). Acceptable here because the
# hook trades local accuracy for zero-dep installation, and CI is the actual
# merge gate.
[formats]
mdx = md

[*.mdx]
BasedOnStyles = Vale, Microsoft, write-good, proselint, x402r

# Disabled Microsoft rules. = NO is explicit-off; the runtime effect varies
# per rule because each ships with a different default `level:` in its YAML.
#
# Contractions:   rule default = error. Without `= NO` it fires ~37x
#                 across docs (irrelevant for technical writing, encourages
#                 informal voice). This is the only real suppression here.
# SentenceLength: rule default = suggestion. Already filtered by our
#                 MinAlertLevel = warning floor regardless of this line.
#                 `= NO` makes intent explicit; behavior unchanged.
#                 Low-ROI rule with no actionable threshold.
# Passive:        rule default = suggestion. Same story as SentenceLength.
#                 Also duplicative — write-good.Passive (enabled below)
#                 fires on identical spans, so enabling both would
#                 double-warn every passive sentence.
#
# Footgun to watch for: a rule that ships with `level: error` and gets
# = suggestion in this file IS a real downgrade — and with our warning
# floor it becomes silent. That's how the earlier Vale.Spelling regression
# happened. Always check the rule file's default before assuming
# `= suggestion` is a downgrade rather than a redundant restatement.
Microsoft.Contractions = NO
Microsoft.SentenceLength = NO
Microsoft.Passive = NO

# Vale.Terms reads the same accept.txt as Vale.Spelling but treats each entry
# as the canonical case form. That fires false positives whenever a vocab
# entry collides with a code identifier (e.g. PaymentInfo type vs paymentInfo
# variable, Hono package vs hono import path, Base chain vs base code
# identifier) or when the entry uses Vale's regex syntax (SDKs? becomes a
# literal canonical-form suggestion). Vocab here is for spelling acceptance
# only, not terminology enforcement — disabled.
Vale.Terms = NO

# Vale.Spelling stays at its default (error) severity here. CI gates real
# typos before merge — the right place for strict spell-check.
#
# The PostToolUse hook in workspace .claude/settings.json filters Vale.Spelling
# out of its output via `vale --filter='.Name != "Vale.Spelling"'` so Claude's
# self-correction context isn't drowned by chain-name and identifier false
# positives. CI (errata-ai/vale-action) does not apply that filter, so PR
# review still sees the full spell-check.
#
# Strict-in-CI / lenient-in-hook pattern, per GitLab and Vaadin Vale configs.
