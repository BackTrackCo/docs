StylesPath = styles
MinAlertLevel = warning
Vocab = x402r

Packages = Microsoft, write-good, proselint

# Parse .mdx as Markdown so Vale doesn't need the separate mdx2vast binary
# (used by the PostToolUse hook for local edit-time linting). The CI action
# (errata-ai/vale-action) installs its own MDX parser server-side.
[formats]
mdx = md

[*.mdx]
BasedOnStyles = Vale, Microsoft, write-good, proselint, x402r

# Disable overly noisy Microsoft rules for docs
Microsoft.Contractions = NO
Microsoft.SentenceLength = suggestion
Microsoft.Passive = suggestion

# Downgrade Vale's built-in spell-check to suggestion. Technical docs trip its
# default dictionary constantly (chain names, identifiers, contract names), and
# false positives at error level drown out style/voice rules in the PostToolUse
# hook output. Per GitLab's tiered convention: error = render-breaking, warning
# = style guide, suggestion = preference. Real-typo detection lives in editor
# review, not CI gating.
Vale.Spelling = suggestion
