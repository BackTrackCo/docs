StylesPath = styles
MinAlertLevel = warning
Vocab = x402r

Packages = Microsoft, write-good, proselint

# Parse .mdx as Markdown so Vale doesn't need the separate mdx2vast binary
# (used by the PostToolUse hook for local edit-time linting). The CI action
# (errata-ai/vale-action) installs its own MDX parser server-side.
[formats]
mdx = md

[*.mdx]
BasedOnStyles = Vale, Microsoft, write-good, proselint, x402r

# Disable overly noisy Microsoft rules for docs
Microsoft.Contractions = NO
Microsoft.SentenceLength = suggestion
Microsoft.Passive = suggestion

# Downgrade Vale's built-in spell-check to warning. Default error severity
# means a few false positives dominate the PostToolUse hook output and bury
# style/voice rules. At warning level spelling still surfaces (and still
# catches real typos), but ranks below errors. Per GitLab's tiered Vale
# convention: error = render-breaking, warning = style guide, suggestion =
# preference. Suggestion would have hidden spelling entirely under our
# current MinAlertLevel = warning floor, regressing typo detection.
Vale.Spelling = warning
